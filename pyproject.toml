[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-city-generator"
version = "0.1.0"
description = "Procedural Minecraft city generation pipelines."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["config", "config.*", "engine", "engine.*", "gui", "gui.*", "pipeline", "pipeline.*"]
