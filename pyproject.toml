[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-city-generator"
version = "0.1.0"
description = "Procedural Minecraft city generation pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "nbtlib>=2.0.4",
]

[project.optional-dependencies]
speed = [
    "numba>=0.59",
]
build = [
    "pyinstaller>=6.10",
    "numba>=0.59",
]

[project.gui-scripts]
citygen = "gui.launcher:main"

[project.scripts]
citygen-doctor = "config.doctor:main"

[tool.setuptools.package-data]
config = ["default_world/*", "default_world/**/*"]
engine = ["color_render.csv"]
gui = ["icons/*.png"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["config", "config.*", "engine", "engine.*", "gui", "gui.*", "pipeline", "pipeline.*"]
